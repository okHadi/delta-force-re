name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      full_checks:
        description: Run the full Windows test suite as well as Linux tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'Windows' || inputs.full_checks == true
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        if: runner.os != 'Windows' || inputs.full_checks == true
      - run: python -m unittest discover -s tests -v
        if: runner.os != 'Windows' || inputs.full_checks == true
      - name: Configure tests
        if: runner.os != 'Windows' || inputs.full_checks == true
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDFRE_BUILD_PROBES=OFF
      - name: Configure Windows game
        if: runner.os == 'Windows' && inputs.full_checks != true
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DDFRE_BUILD_PROBES=OFF
      - run: cmake --build build --config Release --parallel 2
      - name: Run native tests
        if: runner.os != 'Windows' || inputs.full_checks == true
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: delta-force-re-windows
          path: build/Release/dfre.exe
          if-no-files-found: error
          retention-days: 7
